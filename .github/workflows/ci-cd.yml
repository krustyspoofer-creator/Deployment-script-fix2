name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    # Run health checks daily at midnight UTC
    - cron: '0 0 * * *'

env:
  DEPLOYMENT_ENV: production

jobs:
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          if command -v shellcheck &> /dev/null; then
            find . -name "*.sh" -type f -exec shellcheck {} \;
          else
            echo "shellcheck not installed, skipping validation"
          fi

      - name: Validate JSON files
        run: |
          for file in $(find . -name "*.json" -type f); do
            echo "Validating $file"
            python3 -m json.tool "$file" > /dev/null
          done

      - name: Validate YAML files
        run: |
          for file in $(find . -name "*.yml" -o -name "*.yaml" -type f); do
            echo "Validating $file"
            python3 -c "import yaml; yaml.safe_load(open('$file'))"
          done

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security checks
        run: |
          echo "Running security scan..."
          # Check for common security issues in scripts
          if grep -r "password\|secret\|api_key" --include="*.sh" --include="*.py" .; then
            echo "WARNING: Found potential hardcoded credentials"
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint-and-validate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run health checks
        run: |
          echo "Running health checks..."
          if [ -f "deploy.sh" ]; then
            chmod +x deploy.sh
            # Test that the script is valid bash
            bash -n deploy.sh
          fi

      - name: Test deployment script (dry-run)
        run: |
          if [ -f "deploy.sh" ]; then
            echo "Testing deployment script..."
            # Add dry-run tests here
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint-and-validate, security-scan, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment environment
        run: |
          echo "Setting up deployment environment..."
          chmod +x deploy.sh

      - name: Run deployment
        run: |
          echo "Running deployment..."
          ./deploy.sh

      - name: Upload deployment logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-logs
          path: logs/
          retention-days: 30

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run post-deployment health check
        run: |
          echo "Running health checks..."
          if [ -f "health-check.sh" ]; then
            chmod +x health-check.sh
            ./health-check.sh
          fi

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, health-check]
    if: always()
    steps:
      - name: Notify success
        if: ${{ needs.deploy.result == 'success' && needs.health-check.result == 'success' }}
        run: |
          echo "✅ Deployment completed successfully!"

      - name: Notify failure
        if: ${{ needs.deploy.result == 'failure' || needs.health-check.result == 'failure' }}
        run: |
          echo "❌ Deployment failed! Check logs for details."
          exit 1
